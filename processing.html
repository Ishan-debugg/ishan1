<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phase 2: Processing Data & Running Anomaly Model</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="brand">
        <div class="logo">CA</div>
        <div>CA साथी</div>
      </div>
      <nav class="toolbar">
        <a class="btn btn-ghost" href="dashboard.html">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width:720px">
      <div class="card" style="text-align:center">
        <h2 style="margin:0 0 8px">Phase 2: Processing Data & Running Anomaly Model</h2>
        <div class="spinner"></div>
        <div class="progress" style="margin:12px 0 6px"><span id="bar"></span></div>
        <div id="status" class="card-muted" style="margin-bottom:8px">Initializing...</div>
        <div class="caption">This process usually takes 15-30 seconds, please do not close this window.</div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">© <span id="y"></span> CA साथी</div>
  </footer>

  <script src="/assets/app.js"></script>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const steps = [
      'Analyzing 40,000 Transactions... Calculating 16 Risk Features with XGBoost.',
      '1/3 Complete: Reconciliation Check',
      '2/3 Complete: GSTIN & Vendor Mismatch',
      '3/3 Complete: Outlier & Pattern Anomalies',
      'Finalizing Scores & Preparing Report Preview'
    ];
    CA_UI.simulateProcessing((percent, step) => {
      document.getElementById('bar').style.width = percent + '%';
      document.getElementById('status').textContent = step;
      if (percent >= 100) {
        setTimeout(() => CA_UI.navigate('report.html' + location.search), 600);
      }
    }, steps);
  </script>
</body>
</html>
