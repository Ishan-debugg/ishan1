<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CA साथी Professional Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="brand">
        <div class="logo">CA</div>
        <div>CA साथी</div>
      </div>
      <nav class="toolbar">
        <a class="btn btn-ghost" href="index.html">Home</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width:520px">
      <div class="card">
        <h2 style="margin:0 0 8px">CA साथी Professional Login</h2>
        <p class="card-muted" style="margin-bottom:18px">Access your client portfolio and start anomaly detection.</p>
        <form id="loginForm">
          <div style="display:grid; gap:12px">
            <div>
              <label>Email Address</label>
              <input type="email" class="input" required placeholder="you@firm.com" />
            </div>
            <div>
              <label>Password</label>
              <input type="password" class="input" required placeholder="••••••••" />
            </div>
            <button class="btn btn-primary" type="submit">Secure Login</button>
            <div><a class="link" href="#">Forgot Password?</a></div>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">© <span id="y"></span> CA साथी</div>
  </footer>

  <script src="/assets/app.js"></script>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      CA_UI.navigate('dashboard.html');
    });
  </script>
</body>
</html>
